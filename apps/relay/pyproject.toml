[project]
name = "investment-steward-relay"
version = "0.1.0"
description = "轻量同步中转服务（路线图阶段 4）：设备登记 / 变更事件 / 加密中转包。服务器只见密文与元数据。"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
